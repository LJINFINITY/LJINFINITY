<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 60" width="100%" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .headline-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 4px;
        fill: #FBBF24;
        text-transform: uppercase;
        animation: pulseGlowYellow 2.5s infinite ease-in-out;
      }

      @keyframes pulseGlowYellow {
        0%, 100% {
          fill: #FBBF24;
          filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9));
        }
        50% {
          fill: #F59E0B;
          filter: drop-shadow(0 0 22px rgba(245, 158, 11, 1.0));
        }
      }
    </style>
  </defs>

  <g transform="translate(325, 38)">
    <text x="0" y="0" text-anchor="middle" class="headline-text">AI Full Stack Dev &lt;/&gt;</text>
  </g>
</svg>
