<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .sub-header {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #94A3B8;
        text-transform: uppercase;
      }

      .main-title {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 4px;
        fill: #38BDF8;
        text-transform: uppercase;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7));
      }

      .body-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 1.5px;
        fill: #CBD5E1;
      }

      .highlight-text {
        fill: #F59E0B;
        font-weight: 700;
      }
    </style>
  </defs>

  <g transform="translate(425, 0)" text-anchor="middle">
    <!-- Sub Header -->
    <text x="0" y="30" class="sub-header">// SYSTEM NOTIFICATION: VISITOR DETECTED</text>

    <!-- Main Large Title (No unicode star box error) -->
    <text x="0" y="72" class="main-title">HELLO VISITOR! WELCOME TO MY GITHUB PAGE!</text>

    <!-- Body Description -->
    <text x="0" y="108" class="body-text">
      Explore the software I craft with passion • Feel free to connect, <tspan class="highlight-text">always my pleasure!</tspan>
    </text>
  </g>
</svg>
