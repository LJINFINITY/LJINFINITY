<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 85" width="100%" height="85">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .sub-header {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #94A3B8;
        text-transform: uppercase;
      }

      .main-title {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #38BDF8;
        text-transform: uppercase;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
      }

      .body-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 1px;
        fill: #CBD5E1;
      }

      .highlight-text {
        fill: #F59E0B;
        font-weight: 700;
      }
    </style>
  </defs>

  <g transform="translate(350, 0)" text-anchor="middle">
    <!-- Sub Header -->
    <text x="0" y="20" class="sub-header">// SYSTEM NOTIFICATION: VISITOR DETECTED</text>

    <!-- Main Title -->
    <text x="0" y="50" class="main-title">HELLO VISITOR! WELCOME TO MY GITHUB PAGE!</text>

    <!-- Body Text -->
    <text x="0" y="74" class="body-text">
      Explore the software I craft with passion • Feel free to connect, <tspan class="highlight-text">always my pleasure!</tspan>
    </text>
  </g>
</svg>
