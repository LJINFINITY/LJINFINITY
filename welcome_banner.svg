<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 180" width="100%" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .main-title {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #F8FAFC;
        text-transform: uppercase;
      }

      .body-line-1 {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 1.5px;
        fill: #E2E8F0;
      }

      .body-line-2 {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 1.5px;
        fill: #CBD5E1;
      }

      .body-line-3 {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 1.5px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <g transform="translate(475, 0)" text-anchor="middle">
    <!-- Main Title (Monochrome White) -->
    <text x="0" y="42" class="main-title">HELLO VISITOR! WELCOME TO MY GITHUB PAGE!</text>

    <!-- Multi-Line Expanded Body (Zero Clipping) -->
    <text x="0" y="85" class="body-line-1">Feel free to explore the projects, tools, and systems I craft with passion.</text>
    
    <text x="0" y="118" class="body-line-2">Take your time looking around and don't hesitate to reach out or connect.</text>
    
    <text x="0" y="151" class="body-line-3">It will always be my absolute pleasure to collaborate and share work!</text>
  </g>
</svg>
