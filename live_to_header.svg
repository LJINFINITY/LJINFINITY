<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .base-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #94A3B8;
        text-transform: uppercase;
      }

      .sliding-group {
        animation: slideUpInfinite 12s infinite cubic-bezier(0.65, 0, 0.35, 1);
      }

      .word {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .w-think    { fill: #38BDF8; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8)); }
      .w-create   { fill: #8B5CF6; filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.8)); }
      .w-explore  { fill: #10B981; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8)); }
      .w-build    { fill: #F59E0B; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.8)); }
      .w-innovate { fill: #EC4899; filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.8)); }

      @keyframes slideUpInfinite {
        0%, 15%    { transform: translateY(0px); }
        18%, 33%   { transform: translateY(-40px); }
        36%, 51%   { transform: translateY(-80px); }
        54%, 69%   { transform: translateY(-120px); }
        72%, 87%   { transform: translateY(-160px); }
        90%, 98%   { transform: translateY(-200px); }
        100%       { transform: translateY(-200px); }
      }
    </style>
    
    <clipPath id="text-clip">
      <rect x="285" y="10" width="300" height="42" />
    </clipPath>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Static Prefix (x=165 to 275) -->
    <text x="165" y="38" text-anchor="start" class="base-text">LIVE TO</text>

    <!-- Sliding Words Masked Container (x=285 to 585) -->
    <g clip-path="url(#text-clip)">
      <g class="sliding-group" transform="translate(285, 0)">
        <text x="0" y="38" class="word w-think">THINK</text>
        <text x="0" y="78" class="word w-create">CREATE</text>
        <text x="0" y="118" class="word w-explore">EXPLORE</text>
        <text x="0" y="158" class="word w-build">BUILD</text>
        <text x="0" y="198" class="word w-innovate">INNOVATE</text>
        <!-- Duplicate of first word for seamless continuous infinite loop -->
        <text x="0" y="238" class="word w-think">THINK</text>
      </g>
    </g>
  </g>
</svg>
