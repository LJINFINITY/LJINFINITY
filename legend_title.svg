<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 60" width="100%" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .legend-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: #F8FAFC;
        animation: legendGlow 3s infinite ease-in-out;
      }

      .legend-border {
        stroke: url(#cyan-purple-grad);
        stroke-width: 2;
        fill: none;
        rx: 12;
        animation: borderPulse 3s infinite ease-in-out;
      }

      @keyframes legendGlow {
        0% {
          fill: #94A3B8;
          filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3));
        }
        50% {
          fill: #38BDF8;
          filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.9)) drop-shadow(0 0 20px rgba(139, 92, 246, 0.7));
        }
        100% {
          fill: #94A3B8;
          filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3));
        }
      }

      @keyframes borderPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>

    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="740" height="50" class="legend-border" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="legend-text">// YOU ARE WITNESSING THE STORY OF A LEGEND //</text>
</svg>
