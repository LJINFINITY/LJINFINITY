<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 70" width="100%" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .title-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .blue-text {
        fill: #38BDF8;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.85));
      }

      .red-text {
        fill: #EF4444;
        filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.85));
      }
    </style>
  </defs>
  <g text-anchor="middle">
    <text x="50%" y="50%" dominant-baseline="middle" class="title-text blue-text">
      Jerin Rajan
      <animate attributeName="display" values="inline;inline;none;none;inline" keyTimes="0;0.49;0.50;0.99;1.0" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.50;0.99;1.0" dur="6s" repeatCount="indefinite" />
    </text>
    <text x="50%" y="50%" dominant-baseline="middle" class="title-text red-text">
      LJ INFINITY
      <animate attributeName="display" values="none;none;inline;inline;none" keyTimes="0;0.49;0.50;0.99;1.0" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.50;0.99;1.0" dur="6s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
