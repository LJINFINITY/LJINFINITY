<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 70" width="100%" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .title-text {
        font-family: 'Share Tech Mono', monospace, sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .blue-jerin {
        fill: #38BDF8;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.85));
        animation: typeJerin 6s infinite linear;
      }

      .red-lj {
        fill: #EF4444;
        filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.85));
        animation: typeLJ 6s infinite linear;
      }

      @keyframes typeJerin {
        0%   { clip-path: inset(0 100% 0 0); opacity: 1; visibility: visible; }
        22%  { clip-path: inset(0 0% 0 0); opacity: 1; visibility: visible; }
        42%  { clip-path: inset(0 0% 0 0); opacity: 1; visibility: visible; }
        48%  { clip-path: inset(0 100% 0 0); opacity: 1; visibility: visible; }
        49%  { opacity: 0; visibility: hidden; }
        99%  { opacity: 0; visibility: hidden; }
        100% { opacity: 0; visibility: hidden; }
      }

      @keyframes typeLJ {
        0%   { opacity: 0; visibility: hidden; }
        49%  { opacity: 0; visibility: hidden; }
        50%  { clip-path: inset(0 100% 0 0); opacity: 1; visibility: visible; }
        72%  { clip-path: inset(0 0% 0 0); opacity: 1; visibility: visible; }
        92%  { clip-path: inset(0 0% 0 0); opacity: 1; visibility: visible; }
        98%  { clip-path: inset(0 100% 0 0); opacity: 1; visibility: visible; }
        99%  { opacity: 0; visibility: hidden; }
        100% { opacity: 0; visibility: hidden; }
      }
    </style>
  </defs>
  <g text-anchor="middle">
    <text x="50%" y="50%" dominant-baseline="middle" class="title-text blue-jerin">Jerin Rajan</text>
    <text x="50%" y="50%" dominant-baseline="middle" class="title-text red-lj">LJ INFINITY</text>
  </g>
</svg>
