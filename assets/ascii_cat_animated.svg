<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="240">
  <defs>
    <style>
      .term-bg {
        fill: #0D1117;
        stroke: #30363D;
        stroke-width: 1.2px;
      }
      .term-header {
        fill: #161B22;
        stroke: #30363D;
        stroke-width: 1px;
      }
      .term-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #8B949E;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .ascii-body {
        font-family: 'Courier New', Courier, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 14px;
        font-weight: 700;
        fill: #94A3B8;
        letter-spacing: 1.5px;
        white-space: pre;
      }
      .cat-eye {
        fill: #38BDF8;
        filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.9));
        animation: eyeBlink 4s infinite ease-in-out;
        transform-origin: center;
      }
      .cat-whisker {
        fill: #38BDF8;
        opacity: 0.85;
      }
      .cat-nose {
        fill: #F43F5E;
      }
      .cat-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #58A6FF;
        letter-spacing: 1px;
      }
      .cat-status {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        fill: #3FB950;
        font-weight: 600;
      }

      @keyframes eyeBlink {
        0%, 88%, 94%, 100% {
          opacity: 1;
          transform: scaleY(1);
        }
        91% {
          opacity: 0.1;
          transform: scaleY(0.15);
        }
      }

      @keyframes subtleBreath {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-2px);
        }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="320" height="240" rx="10" class="term-bg"/>

  <!-- Window Header Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 310 0 C 315.523 0 320 4.477 320 10 L 320 28 L 0 28 Z" class="term-header" />
  
  <!-- Window Control Dots -->
  <circle cx="16" cy="14" r="5" fill="#FF5F56" />
  <circle cx="32" cy="14" r="5" fill="#FFBD2E" />
  <circle cx="48" cy="14" r="5" fill="#27C93F" />

  <!-- Window Title -->
  <text x="160.0" y="18" text-anchor="middle" class="term-title">neko.sh [PID: 4096]</text>

  <!-- Animated Cat Group -->
  <g style="animation: subtleBreath 4s infinite ease-in-out;">
    <!-- Cat Ears -->
    <text x="160" y="58" text-anchor="middle" class="ascii-body">/\_____/\</text>
    
    <!-- Eyes Line with animated eye spans -->
    <text x="160" y="78" text-anchor="middle" class="ascii-body">/  <tspan class="cat-eye">●</tspan>   <tspan class="cat-eye">●</tspan>  \</text>
    
    <!-- Whiskers & Nose -->
    <text x="160" y="98" text-anchor="middle" class="ascii-body">( <tspan class="cat-whisker">==</tspan>  <tspan class="cat-nose">^</tspan>  <tspan class="cat-whisker">==</tspan> )</text>
    
    <!-- Neck -->
    <text x="160" y="118" text-anchor="middle" class="ascii-body">)         (</text>
    
    <!-- Torso -->
    <text x="160" y="138" text-anchor="middle" class="ascii-body">(           )</text>
    
    <!-- Paws -->
    <text x="160" y="158" text-anchor="middle" class="ascii-body">( (  m   m  ) )</text>

    <!-- Base line -->
    <text x="160" y="174" text-anchor="middle" font-family="monospace" font-size="12" fill="#30363D">═════════════════</text>
  </g>

  <!-- Bottom Telemetry Ticker -->
  <g transform="translate(16, 204)">
    <circle cx="4" cy="4" r="3.5" fill="#3FB950" />
    <text x="15" y="7" class="cat-status">ONLINE // DAEMON RUNNING</text>
    <text x="288" y="7" text-anchor="end" class="cat-tag">LJ-CAT-OS</text>
  </g>
  <line x1="16" y1="192" x2="304" y2="192" stroke="#21262D" stroke-width="1"/>
</svg>