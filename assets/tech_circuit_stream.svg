<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 65" width="100%" height="65">
  <defs>
    <!-- Synced Sunset to Cyan Gradient -->
    <linearGradient id="techBusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feac5e" />
      <stop offset="50%" stop-color="#c779d0" />
      <stop offset="100%" stop-color="#4bc0c8" />
    </linearGradient>

    <!-- Circuit Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feac5e" stop-opacity="0" />
      <stop offset="30%" stop-color="#feac5e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c779d0" stop-opacity="1" />
      <stop offset="70%" stop-color="#4bc0c8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4bc0c8" stop-opacity="0" />
    </linearGradient>

    <filter id="circuitGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bus-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .hex-stream {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #64748B;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background Chassis -->
  <rect x="0" y="0" width="900" height="65" rx="10" fill="#0D1117" />
  <rect x="0" y="0" width="900" height="65" rx="10" fill="none" stroke="url(#techBusGrad)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Circuit Trace Line 1 (Top Bus) -->
  <path d="M30,22 L240,22 L260,35 L620,35 L640,22 L870,22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Flowing Packet on Trace 1 -->
  <circle r="3" fill="#4bc0c8" filter="url(#circuitGlow)">
    <animateMotion path="M30,22 L240,22 L260,35 L620,35 L640,22 L870,22" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Circuit Trace Line 2 (Bottom Bus, Opposite Flow) -->
  <path d="M870,45 L660,45 L640,35 L280,35 L260,45 L30,45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Flowing Packet on Trace 2 -->
  <circle r="3" fill="#feac5e" filter="url(#circuitGlow)">
    <animateMotion path="M870,45 L660,45 L640,35 L280,35 L260,45 L30,45" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Nodes / IC Pads -->
  <circle cx="30" cy="22" r="4" fill="#feac5e" />
  <circle cx="30" cy="45" r="4" fill="#feac5e" />
  <circle cx="870" cy="22" r="4" fill="#4bc0c8" />
  <circle cx="870" cy="45" r="4" fill="#4bc0c8" />

  <!-- Telemetry Badges Across The Bus -->
  <text x="50" y="37" fill="#feac5e" class="bus-label">BUS: PCI-E 4.0</text>
  <text x="215" y="37" class="hex-stream">0x7F8E::SYS_INIT</text>
  <text x="390" y="37" fill="#c779d0" class="bus-label">LOW-LATENCY RUNTIMES</text>
  <text x="635" y="37" class="hex-stream">CUDA::ZERO_LAG</text>
  <text x="760" y="37" fill="#4bc0c8" class="bus-label">ARCH: X86_64</text>
</svg>