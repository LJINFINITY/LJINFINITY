<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Multi-stop Cyber Gradient -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="catGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Chassis Background -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="#0A0E14" stroke="url(#heroBorder)" stroke-width="1.6"/>
  <rect x="6" y="6" width="888" height="208" rx="12" fill="#0D1117" opacity="0.95"/>

  <!-- Subtle Corner Architectural Brackets -->
  <path d="M 18 32 L 18 18 L 32 18" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8"/>
  <path d="M 882 32 L 882 18 L 868 18" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8"/>
  <path d="M 18 188 L 18 202 L 32 202" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8"/>
  <path d="M 882 188 L 882 202 L 868 202" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8"/>

  <!-- LEFT: MINIMALIST GEOMETRIC CYBER-FELINE EMBLEM -->
  <g transform="translate(64, 40)">
    <!-- Feline Shield / Hexagon Frame -->
    <polygon points="70,0 140,40 140,100 70,140 0,100 0,40" fill="#111620" stroke="url(#catGlow)" stroke-width="1.5"/>

    <!-- Geometric Cat Ears -->
    <polygon points="30,44 14,8 52,28" fill="#161B22" stroke="#00F0FF" stroke-width="1.5"/>
    <polygon points="110,44 126,8 88,28" fill="#161B22" stroke="#00F0FF" stroke-width="1.5"/>
    
    <!-- Inner Ear Highlights -->
    <polygon points="32,38 22,18 46,28" fill="#00F0FF" opacity="0.3"/>
    <polygon points="108,38 118,18 94,28" fill="#00F0FF" opacity="0.3"/>

    <!-- Brow & Face Contours -->
    <polyline points="40,54 70,72 100,54" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
    <polyline points="28,72 70,118 112,72" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>

    <!-- Glowing Cyber Eyes -->
    <polygon points="42,66 58,66 52,74 46,74" fill="#00F0FF" filter="url(#neonBlur)"/>
    <polygon points="98,66 82,66 88,74 94,74" fill="#00F0FF" filter="url(#neonBlur)"/>
    
    <!-- Nose & Mouth Core -->
    <polygon points="67,88 73,88 70,93" fill="#EC4899"/>
    <line x1="70" y1="93" x2="70" y2="99" stroke="#E2E8F0" stroke-width="1.2"/>
    <path d="M 64 99 Q 70 104 70 99 Q 70 104 76 99" stroke="#E2E8F0" stroke-width="1.2" fill="none"/>

    <!-- Sleek Whiskers -->
    <line x1="8" y1="84" x2="38" y2="88" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
    <line x1="6" y1="96" x2="36" y2="96" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
    <line x1="132" y1="84" x2="102" y2="88" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>
    <line x1="134" y1="96" x2="104" y2="96" stroke="#00F0FF" stroke-width="1.2" opacity="0.75"/>

    <!-- Small Feline Status Tag -->
    <rect x="18" y="128" width="104" height="18" rx="4" fill="#0A0E14" stroke="#21262D"/>
    <text x="70" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="8.5" font-weight="700" fill="#00F0FF" letter-spacing="1px">FELINE CORE v2.6</text>
  </g>

  <!-- CENTER / RIGHT: IDENTITY, TITLE & ARCHITECTURAL PROFILE -->
  <g transform="translate(254, 52)">
    <!-- Top System Coordinates -->
    <g transform="translate(0, 16)">
      <circle cx="5" cy="5" r="4" fill="#10B981"/>
      <text x="16" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#10B981" letter-spacing="1.5px">SYSTEM ONLINE</text>
      <text x="140" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="600" fill="#64748B">// NODE: LJ-INF-01</text>
      <text x="270" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="600" fill="#64748B">// LATENCY: 0.08ms</text>
    </g>

    <!-- Main Name Title -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" letter-spacing="1.5px">JERIN RAJAN</text>
      <rect x="274" y="-28" width="132" height="26" rx="5" fill="#161B22" stroke="#00F0FF" stroke-width="1.2"/>
      <text x="340" y="-11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="800" fill="#00F0FF" letter-spacing="1px">// LJINFINITY</text>
    </g>

    <!-- Architectural Role Subtitle -->
    <g transform="translate(0, 84)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#C084FC" letter-spacing="0.5px">AI Full-Stack Architect &amp; Autonomous Systems Crafter</text>
    </g>

    <line x1="0" y1="100" x2="590" y2="100" stroke="#21262D" stroke-width="1"/>

    <!-- Telemetry Pills Row -->
    <g transform="translate(0, 114)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="176" height="26" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#38BDF8">ARCH: MULTI-AGENT</text>

      <!-- Pill 2 -->
      <rect x="188" y="0" width="194" height="26" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#A855F7">RIG: HYPRLAND / ENOCH</text>

      <!-- Pill 3 -->
      <rect x="394" y="0" width="194" height="26" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#10B981">FLOW: ZERO-LAG CRAFT</text>
    </g>
  </g>
</svg>