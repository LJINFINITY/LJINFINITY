<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 115" width="100%" height="115">
  <defs>
    <!-- Synced Sunset to Cyan Gradient -->
    <linearGradient id="urielGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feac5e" />
      <stop offset="50%" stop-color="#c779d0" />
      <stop offset="100%" stop-color="#4bc0c8" />
    </linearGradient>

    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4bc0c8" />
      <stop offset="100%" stop-color="#c779d0" />
    </linearGradient>

    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono-chip {
        font-family: 'JetBrains Mono', -apple-system, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .label-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        fill: #ffffff;
      }
      .label-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #94A3B8;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Container Chassis -->
  <rect x="0" y="0" width="900" height="115" rx="12" fill="#0D1117" />
  <rect x="0" y="0" width="900" height="115" rx="12" fill="none" stroke="url(#urielGrad)" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- LEFT: REVOLVING NEURAL AGENT ORB -->
  <g transform="translate(68, 57)">
    <!-- Ambient Core Halo Pulse -->
    <circle r="14" fill="#4bc0c8" opacity="0.35" filter="url(#aiGlow)">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Central Nucleus -->
    <circle r="8" fill="#ffffff" filter="url(#aiGlow)" />

    <!-- Orbital Ring 1 (Inner, Clockwise) -->
    <circle r="25" fill="none" stroke="#4bc0c8" stroke-width="1.5" stroke-dasharray="16, 8" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Orbital Ring 2 (Middle, Counter-Clockwise with Node Dots) -->
    <circle r="36" fill="none" stroke="#c779d0" stroke-width="1.2" stroke-dasharray="24, 12" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
    </circle>
    <!-- Orbiting Satellite Dot on Ring 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      <circle cx="36" cy="0" r="3.5" fill="#feac5e" filter="url(#aiGlow)" />
    </g>

    <!-- Orbital Ring 3 (Outer Sensor Mesh) -->
    <circle r="46" fill="none" stroke="url(#urielGrad)" stroke-width="1" stroke-dasharray="6, 18" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- CONNECTING DATA BUS (Pulsing Light Packets) -->
  <path d="M125,57 L165,57" fill="none" stroke="rgba(75, 192, 200, 0.4)" stroke-width="2" />
  <circle r="3" fill="#4bc0c8" filter="url(#aiGlow)">
    <animateMotion path="M125,57 L165,57" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- CENTER-LEFT: TITLE & METRICS -->
  <text x="175" y="38" class="label-title">URIEL AI // AUTONOMOUS MULTI-AGENT SWARM</text>
  <text x="175" y="58" class="label-desc">Distributed state-machine graph orchestrating dynamic tool execution &amp; self-correction.</text>

  <!-- RIGHT: 3 SWARM AGENT ACTIVE CHIPS -->
  <!-- Chip 1: Planner / State -->
  <g transform="translate(175, 74)">
    <rect width="210" height="26" rx="6" fill="#161B22" stroke="#4bc0c8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="12" cy="13" r="3.5" fill="#4bc0c8" />
    <text x="24" y="17" fill="#4bc0c8" class="mono-chip">PLANNER // GRAPH V2</text>
  </g>

  <!-- Chip 2: Exception Self-Correction -->
  <g transform="translate(400, 74)">
    <rect width="230" height="26" rx="6" fill="#161B22" stroke="#c779d0" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="12" cy="13" r="3.5" fill="#c779d0" />
    <text x="24" y="17" fill="#c779d0" class="mono-chip">SELF-HEAL // RECURSIVE</text>
  </g>

  <!-- Chip 3: Hybrid Vector + Episodic Memory -->
  <g transform="translate(645, 74)">
    <rect width="220" height="26" rx="6" fill="#161B22" stroke="#feac5e" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="12" cy="13" r="3.5" fill="#feac5e" />
    <text x="24" y="17" fill="#feac5e" class="mono-chip">MEMORY // HYBRID STORE</text>
  </g>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(710, 24)">
    <rect width="155" height="22" rx="11" fill="rgba(75, 192, 200, 0.12)" stroke="#4bc0c8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="12" cy="11" r="3" fill="#4bc0c8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="15" fill="#4bc0c8" class="mono-chip">SWARM: ACTIVE ●</text>
  </g>
</svg>